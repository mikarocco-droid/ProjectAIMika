<!-- login.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion — ScoutIA</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav><div class="nav-inner"><a href="/" class="logo">⚽ ScoutIA</a></div></nav>
<div class="auth-page">
  <div class="auth-card">
    <h2>Connexion</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn-primary" style="width:100%">Se connecter</button>
    </form>
    <p class="auth-link">Pas encore de compte ? <a href="/register">S'inscrire</a></p>
  </div>
</div>
</body>
</html>
